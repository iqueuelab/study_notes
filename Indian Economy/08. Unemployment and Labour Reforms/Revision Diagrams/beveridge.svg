<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" role="img" aria-label="Beveridge curve and outward shift"><rect width="480" height="390" fill="white"/><g font-family="Arial" fill="#183c34"><text x="240" y="25" text-anchor="middle" font-size="21" font-weight="bold">Beveridge curve</text><path d="M75 55 V305 H420" fill="none" stroke="#183c34" stroke-width="2"/><path d="M100 65 Q95 265 365 280" fill="none" stroke="#146c62" stroke-width="4"/><path d="M160 65 Q155 230 415 245" fill="none" stroke="#b7643c" stroke-width="3" stroke-dasharray="7 5"/><text x="120" y="112" font-size="18">Expansion</text><text x="240" y="299" font-size="18">Recession</text><text x="250" y="155" font-size="18">Outward shift:</text><text x="250" y="181" font-size="18">weaker matching</text><path d="M220 232 L275 210" stroke="#b7643c" stroke-width="2"/><text x="240" y="348" text-anchor="middle" font-size="18">Unemployment rate →</text><text x="28" y="178" text-anchor="middle" transform="rotate(-90 28 178)" font-size="18">Vacancy rate →</text><text x="240" y="379" text-anchor="middle" font-size="17">Movement along ≠ shift of the curve</text></g></svg>