<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" role="img" aria-label="Conceptual Laffer curve with unknown peak"><rect width="480" height="390" fill="white"/><g font-family="Arial" fill="#183c34"><text x="240" y="28" text-anchor="middle" font-size="22" font-weight="bold">Laffer curve: conceptual</text><path d="M70 60 V305 H430" fill="none" stroke="#183c34" stroke-width="2"/><path d="M70 305 Q245 -145 420 305" fill="none" stroke="#146c62" stroke-width="4"/><circle cx="245" cy="80" r="5" fill="#b7643c"/><text x="245" y="59" text-anchor="middle" font-size="18">Peak is not known in advance</text><text x="117" y="225" font-size="18">Revenue</text><text x="117" y="250" font-size="18">may rise</text><text x="315" y="225" font-size="18">Base may</text><text x="315" y="250" font-size="18">shrink</text><text x="67" y="330" font-size="16">0%</text><text x="392" y="330" font-size="16">100%</text><text x="240" y="358" text-anchor="middle" font-size="19">Tax rate →</text><text x="27" y="180" text-anchor="middle" transform="rotate(-90 27 180)" font-size="19">Tax revenue →</text><text x="240" y="385" text-anchor="middle" font-size="17">A tax cut does not always increase revenue</text></g></svg>