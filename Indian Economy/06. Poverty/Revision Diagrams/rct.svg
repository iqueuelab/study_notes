<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 465" role="img" aria-label="Randomised evaluation"><rect width="480" height="465" fill="white"/><text x="240" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#153e38">Randomised evaluation</text><rect x="16" y="50" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Define eligible units + baseline </text><text x="240" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Pre-specify outcomes and safeguards</text><path d="M240 110 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="130" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Randomly assign units </text><text x="240" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Treatment / control</text><path d="M240 190 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="210" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Intervention in treatment group </text><text x="240" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Comparable control conditions</text><path d="M240 270 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="290" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Measure both groups </text><text x="240" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Track attrition and spillovers</text><path d="M240 350 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="370" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Compare outcomes </text><text x="240" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Assess impact + scope for scale-up</text></svg>