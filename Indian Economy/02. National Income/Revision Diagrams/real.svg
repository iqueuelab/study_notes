<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Rebasing changes the price benchmark; use one comparable series for growth comparisons."><style>text{font:16px Arial,sans-serif;fill:#172536}.axis{stroke:#172536;stroke-width:2;fill:none}.curve{stroke:#12625d;stroke-width:3;fill:none}.alt{stroke:#a44d16;stroke-width:3;fill:none}.dash{stroke:#617080;stroke-width:2;stroke-dasharray:5 5;fill:none}rect{fill:#eef5f3;stroke:#12625d}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Nominal GDP</text><text x="170" y="54" text-anchor="middle">Current prices × current quantities</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Remove price changes</text><text x="170" y="134" text-anchor="middle">Real = nominal × 100 / deflator</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">Real GDP</text><text x="170" y="214" text-anchor="middle">Output compared at constant prices</text></svg>