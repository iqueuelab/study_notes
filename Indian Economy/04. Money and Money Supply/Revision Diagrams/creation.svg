<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Loan creation expands deposit money; principal repayment reverses it."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Bank approves a loan</text><text x="170" y="54" text-anchor="middle">Creates matching deposit</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Borrower makes payment</text><text x="170" y="134" text-anchor="middle">Deposits move between banks</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">Principal is repaid</text><text x="170" y="214" text-anchor="middle">Loan and deposit money shrink</text></svg>