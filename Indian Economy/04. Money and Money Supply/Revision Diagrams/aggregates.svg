<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="M₂ and M₃ add different deposit categories to M₁."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">M₁: public transaction money</text><text x="170" y="54" text-anchor="middle">Currency + demand deposits + OD</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">M₂: post-office addition</text><text x="170" y="124" text-anchor="middle">M₁ + post-office savings deposits</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">M₃: bank time-deposit addition</text><text x="170" y="194" text-anchor="middle">M₁ + bank time deposits</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">M₄: broader post-office addition</text><text x="170" y="264" text-anchor="middle">M₃ + all PO deposits, except NSCs</text></svg>