<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Short run: one variable input, other inputs fixed. Standard production stages."><style>text{font:16px Arial,sans-serif;fill:#172536} .axis{stroke:#172536;stroke-width:2;fill:none} .curve{stroke:#12625d;stroke-width:3;fill:none} .alt{stroke:#a44d16;stroke-width:3;fill:none} .dash{stroke:#617080;stroke-dasharray:4 4;fill:none} rect{fill:#eef5f3;stroke:#12625d} </style><rect x="20" y="10" width="300" height="55" rx="8"/><text x="170" y="33" text-anchor="middle">Stage I · AP rises</text><text x="170" y="54" text-anchor="middle">Ends where MP = AP</text><path class="axis" d="M170 65 v18 l-5 -6 m5 6 l5 -6"/><rect x="20" y="90" width="300" height="55" rx="8"/><text x="170" y="113" text-anchor="middle">Stage II · MP positive, falling</text><text x="170" y="134" text-anchor="middle">Ends at MP = 0; TP maximum</text><path class="axis" d="M170 145 v18 l-5 -6 m5 6 l5 -6"/><rect x="20" y="170" width="300" height="55" rx="8"/><text x="170" y="193" text-anchor="middle">Stage III · MP negative</text><text x="170" y="214" text-anchor="middle">TP falls</text></svg>