<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-label="Lorenz curve: Gini area and Hoover gap"><rect width="480" height="440" fill="white"/><g font-family="Arial" fill="#183c34"><text x="240" y="25" text-anchor="middle" font-size="21" font-weight="bold">Lorenz curve: two different measures</text><path d="M75 340 L390 60 Q285 315 75 340" fill="#d8e9df"/><path d="M75 55 V340 H405" fill="none" stroke="#183c34" stroke-width="2"/><path d="M75 340 L390 60" stroke="#608372" stroke-width="2"/><path d="M75 340 Q285 315 390 60" fill="none" stroke="#146c62" stroke-width="4"/><path d="M235 198 V285" stroke="#bf622f" stroke-width="3"/><text x="248" y="251" font-size="18">Hoover: max gap</text><text x="97" y="148" font-size="18">Gini uses</text><text x="97" y="172" font-size="18">the shaded area</text><text x="108" y="322" font-size="18">Lorenz curve</text><text x="250" y="127" font-size="18" transform="rotate(-42 250 127)">Equality line</text><text x="240" y="385" text-anchor="middle" font-size="18">Population: poorest → richest (%)</text><text x="23" y="200" text-anchor="middle" transform="rotate(-90 23 200)" font-size="18">Cumulative income (%)</text><text x="60" y="360" font-size="16">0</text><text x="370" y="360" font-size="16">100</text><text x="36" y="68" font-size="16">100</text><text x="240" y="420" text-anchor="middle" font-size="18">Gini = shaded area / area under equality line</text></g></svg>