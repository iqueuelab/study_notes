<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-label="Free Ombudsman redress operates after the first complaint to the service provider."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Complain to regulated entity</text><text x="170" y="54" text-anchor="middle">Keep details and evidence</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Rejected / unsatisfactory reply</text><text x="170" y="134" text-anchor="middle">Or no response within 30 days</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">RBI complaint route</text><text x="170" y="214" text-anchor="middle">CMS / CRPC · eligible entities</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">Resolution / applicable appeal</text><text x="170" y="294" text-anchor="middle">Follow scheme and time limits</text></svg>