<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-label="Formal division concealed the concentration of effective Company power."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Company holds diwani</text><text x="170" y="54" text-anchor="middle">Revenue + practical political control</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Nawab nominally holds nizamat</text><text x="170" y="134" text-anchor="middle">Administration through deputies</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">Power without accountability</text><text x="170" y="214" text-anchor="middle">Coercion · extraction · corruption</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">1765–72</text><text x="170" y="294" text-anchor="middle">Famine 1770 · Hastings ends system</text></svg>