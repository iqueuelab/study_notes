<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-label="Commercial dispute and court factionalism converged in the Plassey conspiracy."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Trade privilege abused</text><text x="170" y="54" text-anchor="middle">Dastaks + revenue loss</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Authority challenged</text><text x="170" y="134" text-anchor="middle">Fortification + shelter to rivals</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">Court coalition forms</text><text x="170" y="214" text-anchor="middle">Mir Jafar + bankers + Company</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">23 June 1757 · Plassey</text><text x="170" y="294" text-anchor="middle">Non-cooperation → Siraj defeated</text></svg>