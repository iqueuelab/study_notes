<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 350" role="img" aria-label="Correct sequence of Nawabs during the transfer of Bengal’s effective power."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Siraj · 1756–57</text><text x="170" y="54" text-anchor="middle">Fort William → Alinagar → Plassey</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Mir Jafar · 1757–60</text><text x="170" y="124" text-anchor="middle">Company demands · Dutch failure</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Mir Qasim · 1760–63</text><text x="170" y="194" text-anchor="middle">Munger · reform · duties abolished</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Mir Jafar · 1763–65</text><text x="170" y="264" text-anchor="middle">Restored before Buxar</text><rect x="15" y="290" width="310" height="55" rx="7"/><text x="170" y="313" text-anchor="middle">Najm-ud-Daulah · 1765</text><text x="170" y="334" text-anchor="middle">Dependent Nawab · dual government</text></svg>