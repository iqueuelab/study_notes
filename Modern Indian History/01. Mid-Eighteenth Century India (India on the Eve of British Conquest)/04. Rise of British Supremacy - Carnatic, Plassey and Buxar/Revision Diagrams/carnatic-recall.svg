<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Three wars: trigger, settlement and decisive battle."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">First · 1746–48</text><text x="170" y="54" text-anchor="middle">Austrian succession → Aix</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Second · 1749–54</text><text x="170" y="124" text-anchor="middle">Local successions → Pondicherry</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Third · 1756/57–63</text><text x="170" y="194" text-anchor="middle">Seven Years’ War → Paris</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Decisive battle · 1760</text><text x="170" y="264" text-anchor="middle">Wandiwash · Eyre Coote vs Lally</text></svg>