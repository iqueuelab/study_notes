<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 350" role="img" aria-label="Associate each early ruler with the event or power behind his throne."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Bahadur Shah I · 1707–12</text><text x="170" y="54" text-anchor="middle">Muazzam · conciliation</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Jahandar Shah · 1712–13</text><text x="170" y="124" text-anchor="middle">Zulfiqar Khan · defeated at Agra</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Farrukhsiyar · 1713–19</text><text x="170" y="194" text-anchor="middle">Sayyids · 1717 farman</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Two short reigns · 1719</text><text x="170" y="264" text-anchor="middle">Rafi-ud-Darajat → Shah Jahan II</text><rect x="15" y="290" width="310" height="55" rx="7"/><text x="170" y="313" text-anchor="middle">Muhammad Shah · 1719–48</text><text x="170" y="334" text-anchor="middle">Rangeela · regional breakup</text></svg>