<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Keep Persian and Afghan rulers, campaigns and outcomes distinct."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1739 · Persian invasion</text><text x="170" y="54" text-anchor="middle">Nadir Shah · Karnal · Delhi sack</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">1748–67 · Afghan expeditions</text><text x="170" y="124" text-anchor="middle">Abdali / Durrani</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">1752 → 1757</text><text x="170" y="194" text-anchor="middle">Punjab ceded → Delhi plundered</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">1758 → 1761</text><text x="170" y="264" text-anchor="middle">Maratha Punjab → Panipat defeat</text></svg>