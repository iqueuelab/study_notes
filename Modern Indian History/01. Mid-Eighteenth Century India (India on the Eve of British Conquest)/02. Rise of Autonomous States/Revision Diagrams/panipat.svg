<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-label="Panipat checked expansion but did not end Maratha political power."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1758: Marathas occupy Punjab</text><text x="170" y="54" text-anchor="middle">Timur expelled → Abdali returns</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Weak alliances + supply crisis</text><text x="170" y="134" text-anchor="middle">Bhau · Vishwas Rao · Gardi</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">14 January 1761</text><text x="170" y="214" text-anchor="middle">Marathas defeated at Panipat</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">Severe setback, then recovery</text><text x="170" y="294" text-anchor="middle">Madhav Rao + Mahadji rebuild power</text></svg>