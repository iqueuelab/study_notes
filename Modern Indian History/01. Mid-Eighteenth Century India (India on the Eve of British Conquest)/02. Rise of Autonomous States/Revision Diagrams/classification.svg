<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Three trajectories of regional State-building; imperial legitimacy often survived."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Successor states</text><text x="170" y="54" text-anchor="middle">Hyderabad · Carnatic · Bengal · Awadh</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">New powers</text><text x="170" y="124" text-anchor="middle">Marathas · Sikhs · Jats · Afghans</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Established kingdoms</text><text x="170" y="194" text-anchor="middle">Mysore · Kerala · Rajput states</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Common pattern</text><text x="170" y="264" text-anchor="middle">Regional power + imperial legitimacy</text></svg>