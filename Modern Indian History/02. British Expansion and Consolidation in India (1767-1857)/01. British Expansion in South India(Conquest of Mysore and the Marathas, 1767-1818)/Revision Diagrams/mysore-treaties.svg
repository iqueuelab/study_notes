<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Four Mysore wars: dates, settlements and outcomes."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">I · 1767–69 → Madras</text><text x="170" y="54" text-anchor="middle">Hyder gains favourable peace</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">II · 1780–84 → Mangalore</text><text x="170" y="124" text-anchor="middle">Mutual restoration · Tipu continues</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">III · 1790–92 → Seringapatam</text><text x="170" y="194" text-anchor="middle">Half territory · indemnity · hostages</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">IV · 1799 → Tipu killed</text><text x="170" y="264" text-anchor="middle">Partition · Wadiyar subsidiary State</text></svg>