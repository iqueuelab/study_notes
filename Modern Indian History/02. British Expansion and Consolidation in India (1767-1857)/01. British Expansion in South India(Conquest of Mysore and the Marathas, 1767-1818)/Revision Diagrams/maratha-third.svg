<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Third war consolidated paramountcy and ended the Peshwa’s office."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1816–17 · treaties tighten control</text><text x="170" y="54" text-anchor="middle">Nagpur · Poona · Gwalior</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">November–December 1817</text><text x="170" y="124" text-anchor="middle">Khadki · Sitabaldi · Mahidpur</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">6 January 1818 · Mandsaur</text><text x="170" y="194" text-anchor="middle">Holkar accepts dependent position</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">June 1818 · Peshwa surrenders</text><text x="170" y="264" text-anchor="middle">Office abolished · pension at Bithoor</text></svg>