<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 385" role="img" aria-label="Commercialisation of agriculture"><rect width="480" height="385" fill="white"/><text x="240" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#153e38">Commercialisation of agriculture</text><rect x="16" y="50" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Market demand + tax pressure</text><text x="240" y="97" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">More sale-oriented production</text><path d="M240 110 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="130" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Cash crops + merchant credit</text><text x="240" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Cotton, indigo, opium, tea, jute</text><path d="M240 190 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="210" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Price risk + debt</text><text x="240" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Food security may weaken</text><path d="M240 270 v16 m-5 -5 l5 5 5 -5" fill="none" stroke="#356858" stroke-width="2"/><rect x="16" y="290" width="448" height="58" rx="9" fill="#edf5f0" stroke="#598a78"/><text x="240" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Uneven gains</text><text x="240" y="337" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#183c34">Traders / lenders often benefit</text></svg>