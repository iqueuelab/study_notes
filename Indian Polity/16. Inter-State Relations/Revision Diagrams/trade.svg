<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 325" role="img" aria-label="Parallel constitutional powers and limits."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">301: General freedom</text><text x="170" y="45" text-anchor="middle">Inter-State + intra-State</text><text x="170" y="63" text-anchor="middle">Common economic space</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Union: 302 / 303</text><text x="170" y="130" text-anchor="middle">Public-interest restrictions</text><text x="170" y="148" text-anchor="middle">Scarcity exception to State preference</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">State: 304(a)</text><text x="170" y="215" text-anchor="middle">Tax imported and local goods fairly</text><text x="170" y="233" text-anchor="middle">No discriminatory import tax</text><rect x="10" y="260" width="320" height="65" rx="7"/><text x="170" y="280" text-anchor="middle" font-weight="bold">State: 304(b)</text><text x="170" y="300" text-anchor="middle">Reasonable public-interest restriction</text><text x="170" y="318" text-anchor="middle">Prior presidential sanction</text></svg>