<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Follow the changing boundary of Parliament’s amendment power."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1951 → 1964 / 1965</text><text x="170" y="54" text-anchor="middle">Rights amendments upheld</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">1967 → 1971</text><text x="170" y="124" text-anchor="middle">Golaknath → 24th Amendment</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">1973 → 1975</text><text x="170" y="194" text-anchor="middle">Basic structure → election review</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">1976 → 1980</text><text x="170" y="264" text-anchor="middle">Unlimited claim → Minerva Mills</text></svg>