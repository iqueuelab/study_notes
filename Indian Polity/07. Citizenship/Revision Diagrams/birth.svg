<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Birth rules depend on date and parental status; statutory exceptions apply."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1950–30 June 1987</text><text x="170" y="54" text-anchor="middle">Generally birth in India</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">1 July 1987–2 December 2004</text><text x="170" y="124" text-anchor="middle">At least one Indian parent</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">From 3 December 2004</text><text x="170" y="194" text-anchor="middle">Both Indian, or one Indian +</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">2004 condition continued</text><text x="170" y="264" text-anchor="middle">Other parent not an illegal migrant</text></svg>