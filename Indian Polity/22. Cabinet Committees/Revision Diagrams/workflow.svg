<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Delegation reduces workload while retaining Cabinet oversight."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Ministries: examine and consult</text><text x="170" y="45" text-anchor="middle">Cross-ministry issues coordinated</text><text x="170" y="63" text-anchor="middle">Proposal referred to committee</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Cabinet Committee / ad hoc GoM</text><text x="170" y="130" text-anchor="middle">Specialised scrutiny and coordination</text><text x="170" y="148" text-anchor="middle">Recommend or decide if authorised</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Cabinet oversight remains</text><text x="170" y="215" text-anchor="middle">Reserved matters go to Cabinet</text><text x="170" y="233" text-anchor="middle">Cabinet can review committee decisions</text></svg>