<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Article 352 approval and revocation safeguards."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Written Cabinet decision</text><text x="170" y="45" text-anchor="middle">President issues proclamation</text><text x="170" y="63" text-anchor="middle">Whole India or specified part</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Both Houses: within 1 month</text><text x="170" y="130" text-anchor="middle">Total majority + two-thirds P/V</text><text x="170" y="148" text-anchor="middle">Renew every 6 months</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Revocation / disapproval</text><text x="170" y="215" text-anchor="middle">President revokes; LS can disapprove</text><text x="170" y="233" text-anchor="middle">1/10 notice → sitting in 14 days</text></svg>