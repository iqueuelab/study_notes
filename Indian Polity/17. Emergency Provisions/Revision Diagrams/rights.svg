<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 155" role="img" aria-label="Rights and judicial enforcement must be distinguished."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">358: Article 19</text><text x="170" y="45" text-anchor="middle">Automatic; external Emergency only</text><text x="170" y="63" text-anchor="middle">Emergency-related law protection</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">359: Specified enforcement</text><text x="170" y="130" text-anchor="middle">Presidential order; either Emergency</text><text x="170" y="148" text-anchor="middle">Articles 20 / 21 remain enforceable</text></svg>