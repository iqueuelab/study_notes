<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="President impeachment separately needs two-thirds total."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Simple: present and voting</text><text x="170" y="45" text-anchor="middle">More than half; exclude abstainers</text><text x="170" y="63" text-anchor="middle">Ordinary Bills / confidence</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Effective: all then members</text><text x="170" y="130" text-anchor="middle">Total membership minus vacancies</text><text x="170" y="148" text-anchor="middle">Speaker / Deputy removal</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Special: check BOTH thresholds</text><text x="170" y="215" text-anchor="middle">Total majority + 2/3 present/voting</text><text x="170" y="233" text-anchor="middle">Amendment / Emergency approval</text></svg>