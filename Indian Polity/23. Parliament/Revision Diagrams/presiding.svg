<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Distinguish absence from vacancy."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Speaker absent / office vacant</text><text x="170" y="45" text-anchor="middle">Deputy Speaker performs duties</text><text x="170" y="63" text-anchor="middle">Same chair powers while presiding</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Both offices vacant</text><text x="170" y="130" text-anchor="middle">President appoints an LS member</text><text x="170" y="148" text-anchor="middle">Panel cannot fill this vacancy</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Routine absence of both</text><text x="170" y="215" text-anchor="middle">Panel member may preside</text><text x="170" y="233" text-anchor="middle">Not the same as vacant offices</text></svg>