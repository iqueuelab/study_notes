<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 325" role="img" aria-label="An ordinary Bill becomes law after assent."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Introduce: first reading</text><text x="170" y="45" text-anchor="middle">Title / objectives / publication</text><text x="170" y="63" text-anchor="middle">Either House for ordinary Bill</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Scrutinise: second reading</text><text x="170" y="130" text-anchor="middle">Principles; optional committee</text><text x="170" y="148" text-anchor="middle">Clauses / amendments / votes</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Pass and obtain agreement</text><text x="170" y="215" text-anchor="middle">Third reading + other House</text><text x="170" y="233" text-anchor="middle">Same text or eligible joint sitting</text><path d="M170 240 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="260" width="320" height="65" rx="7"/><text x="170" y="280" text-anchor="middle" font-weight="bold">President: Article 111</text><text x="170" y="300" text-anchor="middle">Assent / withhold / return once</text><text x="170" y="318" text-anchor="middle">Repassed ordinary Bill binds</text></svg>