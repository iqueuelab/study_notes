<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Three funds have different purposes and procedures."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Consolidated Fund: 266(1)</text><text x="170" y="45" text-anchor="middle">Revenues + loans + repayments</text><text x="170" y="63" text-anchor="middle">Appropriation for withdrawals</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Public Account: 266(2)</text><text x="170" y="130" text-anchor="middle">Deposits / provident funds</text><text x="170" y="148" text-anchor="middle">No parliamentary appropriation</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Contingency Fund: 267</text><text x="170" y="215" text-anchor="middle">Unforeseen expenditure advances</text><text x="170" y="233" text-anchor="middle">Later authorisation + recoupment</text></svg>