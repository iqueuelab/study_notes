<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" role="img" aria-label="Adoption, signing and commencement are three distinct events."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">29 August 1947</text><text x="170" y="54" text-anchor="middle">Drafting Committee set up</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">February → October 1948</text><text x="170" y="134" text-anchor="middle">Public draft → revised draft</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">4 November 1948 onwards</text><text x="170" y="214" text-anchor="middle">Three readings and scrutiny</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">26 November 1949</text><text x="170" y="294" text-anchor="middle">Constitution adopted</text><path class="axis" d="M170 305 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="330" width="310" height="55" rx="7"/><text x="170" y="353" text-anchor="middle">24 → 26 January 1950</text><text x="170" y="374" text-anchor="middle">Signed → principal commencement</text></svg>