<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 350" role="img" aria-label="Provincial dyarchy split responsibility within one province."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1919: provincial dyarchy</text><text x="170" y="54" text-anchor="middle">Two sets of provincial subjects</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Transferred: ministers</text><text x="170" y="124" text-anchor="middle">Education · health · agriculture</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Responsible to legislature</text><text x="170" y="194" text-anchor="middle">Also local self-government</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Reserved: Governor + Council</text><text x="170" y="264" text-anchor="middle">Police · justice · revenue · finance</text><rect x="15" y="290" width="310" height="55" rx="7"/><text x="170" y="313" text-anchor="middle">Not responsible to legislature</text><text x="170" y="334" text-anchor="middle">Key coercive and financial powers</text></svg>