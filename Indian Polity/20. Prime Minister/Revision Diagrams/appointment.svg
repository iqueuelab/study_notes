<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Appointment depends on parliamentary confidence."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Clear LS majority</text><text x="170" y="45" text-anchor="middle">President appoints its leader</text><text x="170" y="63" text-anchor="middle">Constitutional parliamentary convention</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Hung House / sudden vacancy</text><text x="170" y="130" text-anchor="middle">Identify leader with credible support</text><text x="170" y="148" text-anchor="middle">Confidence tested within reasonable time</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Member of either House</text><text x="170" y="215" text-anchor="middle">Non-MP appointment possible</text><text x="170" y="233" text-anchor="middle">Must enter Parliament within 6 months</text></svg>