<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Preventive safeguards differ from ordinary criminal-arrest safeguards."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Ordinary arrest</text><text x="170" y="54" text-anchor="middle">Grounds · lawyer · magistrate in 24h</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Preventive detention</text><text x="170" y="124" text-anchor="middle">Grounds · representation · review</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Advisory Board threshold</text><text x="170" y="194" text-anchor="middle">Operative general rule: 3 months</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Do not mix the regimes</text><text x="170" y="264" text-anchor="middle">22(1)–(2) exceptions are specific</text></svg>