<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Religious freedom has provision-specific limits."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">25: individual freedom</text><text x="170" y="54" text-anchor="middle">Conscience · profession · practice</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">26: denomination affairs</text><text x="170" y="124" text-anchor="middle">Institutions · religious management</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">27: taxation</text><text x="170" y="194" text-anchor="middle">No earmarked tax for one religion</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">28: educational institutions</text><text x="170" y="264" text-anchor="middle">Funding / trust / consent distinctions</text></svg>