<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 410" role="img" aria-label="Identify levy, collection and appropriation separately."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">268: Stamp duties</text><text x="170" y="45" text-anchor="middle">Union levy → State collection</text><text x="170" y="63" text-anchor="middle">State keeps proceeds</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">269: Assigned taxes</text><text x="170" y="130" text-anchor="middle">Union levy and collection</text><text x="170" y="148" text-anchor="middle">Assigned to States</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">269A: Inter-State GST</text><text x="170" y="215" text-anchor="middle">Union levy and collection</text><text x="170" y="233" text-anchor="middle">Apportioned Union + States</text><rect x="10" y="260" width="320" height="65" rx="7"/><text x="170" y="280" text-anchor="middle" font-weight="bold">270: Divisible pool</text><text x="170" y="300" text-anchor="middle">Shareable Union taxes</text><text x="170" y="318" text-anchor="middle">FC recommends distribution</text><rect x="10" y="345" width="320" height="65" rx="7"/><text x="170" y="365" text-anchor="middle" font-weight="bold">271: Union surcharge</text><text x="170" y="385" text-anchor="middle">Union keeps proceeds</text><text x="170" y="403" text-anchor="middle">Not imposed on 246A GST</text></svg>