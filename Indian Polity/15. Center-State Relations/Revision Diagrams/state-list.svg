<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 410" role="img" aria-label="Five different routes: compare trigger, consent and duration."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">249: National interest</text><text x="170" y="45" text-anchor="middle">RS: two-thirds present/voting</text><text x="170" y="63" text-anchor="middle">Resolution ≤1 year; law +6 months</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">250: National Emergency</text><text x="170" y="130" text-anchor="middle">Emergency operates</text><text x="170" y="148" text-anchor="middle">Law +6 months after it ends</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">252: Two or more States</text><text x="170" y="215" text-anchor="middle">Request + parliamentary enactment</text><text x="170" y="233" text-anchor="middle">Only Parliament amends/repeals</text><rect x="10" y="260" width="320" height="65" rx="7"/><text x="170" y="280" text-anchor="middle" font-weight="bold">253: International obligations</text><text x="170" y="300" text-anchor="middle">Treaty / agreement / convention</text><text x="170" y="318" text-anchor="middle">No prior State-consent requirement</text><rect x="10" y="345" width="320" height="65" rx="7"/><text x="170" y="365" text-anchor="middle" font-weight="bold">356/357: President’s Rule</text><text x="170" y="385" text-anchor="middle">Parliament exercises State power</text><text x="170" y="403" text-anchor="middle">Laws survive; State can later change</text></svg>