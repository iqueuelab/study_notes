<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Executive delegation does not itself transfer legislative competence."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">258(1): Union → State</text><text x="170" y="45" text-anchor="middle">President + State consent</text><text x="170" y="63" text-anchor="middle">Executive functions entrusted</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">258(2): Union → State</text><text x="170" y="130" text-anchor="middle">Parliamentary law</text><text x="170" y="148" text-anchor="middle">Consent not required by this route</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">258A: State → Union</text><text x="170" y="215" text-anchor="middle">Governor + Union consent</text><text x="170" y="233" text-anchor="middle">Executive functions entrusted</text></svg>