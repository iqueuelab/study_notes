<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" role="img" aria-label="Linguistic reorganisation developed through demands, commissions and legislation."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1948: Dhar</text><text x="170" y="54" text-anchor="middle">Administrative convenience</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">1948–49: JVP</text><text x="170" y="134" text-anchor="middle">No immediate linguistic basis</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">1953: Andhra</text><text x="170" y="214" text-anchor="middle">First post-independence linguistic State</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">1953–55: Fazl Ali</text><text x="170" y="294" text-anchor="middle">Language + unity + viability + welfare</text><path class="axis" d="M170 305 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="330" width="310" height="55" rx="7"/><text x="170" y="353" text-anchor="middle">1956: reorganisation</text><text x="170" y="374" text-anchor="middle">14 States + 6 UTs</text></svg>