<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-label="Associate-State status was temporary; full statehood followed in 1975."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Protectorate</text><text x="170" y="54" text-anchor="middle">1950 treaty formalised relationship</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">1974: associate State</text><text x="170" y="134" text-anchor="middle">35th · Article 2A · old Schedule 10</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">1975: full State</text><text x="170" y="214" text-anchor="middle">36th · 371F · 22nd State</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">Earlier arrangement repealed</text><text x="170" y="294" text-anchor="middle">2A + original Schedule 10 removed</text></svg>