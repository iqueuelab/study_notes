<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Three meanings of ministerial responsibility."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Collective: whole ministry</text><text x="170" y="45" text-anchor="middle">All stand or fall together</text><text x="170" y="63" text-anchor="middle">Answerable to Lok Sabha</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Individual: one minister</text><text x="170" y="130" text-anchor="middle">President’s pleasure on PM advice</text><text x="170" y="148" text-anchor="middle">Other ministers may remain</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Ordinary legal liability</text><text x="170" y="215" text-anchor="middle">No general countersignature rule</text><text x="170" y="233" text-anchor="middle">No exemption from ordinary law</text></svg>