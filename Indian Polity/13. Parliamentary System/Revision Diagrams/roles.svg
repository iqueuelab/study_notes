<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Distinguish constitutional office, political leadership and House responsibility."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">President</text><text x="170" y="54" text-anchor="middle">Head of State · constitutional role</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Prime Minister</text><text x="170" y="124" text-anchor="middle">Head of government · leads Council</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Council of Ministers</text><text x="170" y="194" text-anchor="middle">Collectively responsible to Lok Sabha</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Membership rule</text><text x="170" y="264" text-anchor="middle">Either House · non-MP: six months</text></svg>