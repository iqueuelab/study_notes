<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 350" role="img" aria-label="Five independent questions classify a Constitution."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Origin</text><text x="170" y="54" text-anchor="middle">Evolved ↔ enacted</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Form</text><text x="170" y="124" text-anchor="middle">Codified ↔ uncodified</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Amendment</text><text x="170" y="194" text-anchor="middle">Rigid ↔ flexible</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Territorial power</text><text x="170" y="264" text-anchor="middle">Federal ↔ unitary</text><rect x="15" y="290" width="310" height="55" rx="7"/><text x="170" y="313" text-anchor="middle">Purpose</text><text x="170" y="334" text-anchor="middle">Procedural ↔ prescriptive</text></svg>