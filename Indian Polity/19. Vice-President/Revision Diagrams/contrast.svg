<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Electoral colleges and removal thresholds differ."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">President election</text><text x="170" y="45" text-anchor="middle">Elected MPs + elected MLAs</text><text x="170" y="63" text-anchor="middle">States + Delhi / Puducherry</text><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Vice-President election</text><text x="170" y="130" text-anchor="middle">Elected AND nominated MPs</text><text x="170" y="148" text-anchor="middle">No MLAs; equal vote value</text><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Removal differs</text><text x="170" y="215" text-anchor="middle">President: 2/3 TOTAL each House</text><text x="170" y="233" text-anchor="middle">VP: RS effective + LS simple</text></svg>