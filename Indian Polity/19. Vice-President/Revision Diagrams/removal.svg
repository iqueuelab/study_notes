<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Article 67: only Rajya Sabha initiates."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Rajya Sabha initiates</text><text x="170" y="45" text-anchor="middle">At least 14 days’ notice</text><text x="170" y="63" text-anchor="middle">No specified constitutional ground</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Rajya Sabha resolution</text><text x="170" y="130" text-anchor="middle">Majority of all then members</text><text x="170" y="148" text-anchor="middle">Effective majority</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Lok Sabha agrees</text><text x="170" y="215" text-anchor="middle">Simple majority</text><text x="170" y="233" text-anchor="middle">Removal, not impeachment</text></svg>