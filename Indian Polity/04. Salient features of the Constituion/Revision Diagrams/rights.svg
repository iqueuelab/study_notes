<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Rights, remedies and emergency effects must be distinguished."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Part III: enforceable rights</text><text x="170" y="54" text-anchor="middle">Some for citizens; some all persons</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Article 32: Supreme Court</text><text x="170" y="124" text-anchor="middle">Fundamental Rights remedies</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Article 226: High Courts</text><text x="170" y="194" text-anchor="middle">Rights + other legal purposes</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Emergency: Articles 358/359</text><text x="170" y="264" text-anchor="middle">Different rules; 20/21 protected</text></svg>