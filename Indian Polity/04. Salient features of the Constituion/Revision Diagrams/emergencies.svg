<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Three emergency provisions have different conditions and effects."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">352: National Emergency</text><text x="170" y="54" text-anchor="middle">War · aggression · armed rebellion</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">356: President’s Rule</text><text x="170" y="124" text-anchor="middle">State constitutional failure</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">360: Financial Emergency</text><text x="170" y="194" text-anchor="middle">Financial stability/credit threatened</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">365: Union directions</text><text x="170" y="264" text-anchor="middle">Related ground; not a fourth type</text></svg>