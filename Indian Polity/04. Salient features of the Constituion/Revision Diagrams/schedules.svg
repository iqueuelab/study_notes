<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="Recall all twelve Schedules in three groups plus local government."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">1–4: institutional framework</text><text x="170" y="54" text-anchor="middle">Territory · pay · oaths · RS seats</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">5–8: areas, powers, languages</text><text x="170" y="124" text-anchor="middle">Scheduled/tribal · lists · languages</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">9–10: laws and legislators</text><text x="170" y="194" text-anchor="middle">Protected laws · anti-defection</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">11–12: local functions</text><text x="170" y="264" text-anchor="middle">Panchayats 29 · municipalities 18</text></svg>