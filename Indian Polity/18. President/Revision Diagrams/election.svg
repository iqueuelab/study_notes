<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Election method and representation."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Electoral college</text><text x="170" y="45" text-anchor="middle">Elected MPs + elected Assembly members</text><text x="170" y="63" text-anchor="middle">States + Delhi / Puducherry</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Weighted secret preferential ballot</text><text x="170" y="130" text-anchor="middle">MLA value uses 1971 population</text><text x="170" y="148" text-anchor="middle">MP value balances total MLA value</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Count / transfer preferences</text><text x="170" y="215" text-anchor="middle">Quota = floor(valid value / 2) + 1</text><text x="170" y="233" text-anchor="middle">Supreme Court decides disputes</text></svg>