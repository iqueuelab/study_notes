<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Ordinances require legislative scrutiny."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Either or both Houses in recess</text><text x="170" y="45" text-anchor="middle">Immediate action necessary</text><text x="170" y="63" text-anchor="middle">Council advice + constitutional limits</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Temporary law: Article 123</text><text x="170" y="130" text-anchor="middle">Laid before both Houses</text><text x="170" y="148" text-anchor="middle">No constitutional amendment</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Reassembly starts expiry clock</text><text x="170" y="215" text-anchor="middle">Later date if Houses differ</text><text x="170" y="233" text-anchor="middle">Six weeks; earlier withdrawal / rejection</text></svg>