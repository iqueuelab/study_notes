<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" role="img" aria-label="Article 61: use total-membership thresholds."><style>text{font:15px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}path{stroke:#12625d;stroke-width:2;fill:none}</style><rect x="10" y="5" width="320" height="65" rx="7"/><text x="170" y="25" text-anchor="middle" font-weight="bold">Either House initiates</text><text x="170" y="45" text-anchor="middle">At least 1/4 sign; 14-day notice</text><text x="170" y="63" text-anchor="middle">At least 2/3 TOTAL membership</text><path d="M170 70 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="90" width="320" height="65" rx="7"/><text x="170" y="110" text-anchor="middle" font-weight="bold">Other House investigates</text><text x="170" y="130" text-anchor="middle">President can appear / be represented</text><text x="170" y="148" text-anchor="middle">At least 2/3 TOTAL sustains charges</text><path d="M170 155 v16 m-5 -5 l5 5 l5 -5"/><rect x="10" y="175" width="320" height="65" rx="7"/><text x="170" y="195" text-anchor="middle" font-weight="bold">Removal effective</text><text x="170" y="215" text-anchor="middle">Date second House passes resolution</text><text x="170" y="233" text-anchor="middle">MPs participate; MLAs excluded</text></svg>