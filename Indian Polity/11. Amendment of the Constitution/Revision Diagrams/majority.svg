<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-label="A constitutional majority combines total membership and actual votes."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Total membership: 250</text><text x="170" y="54" text-anchor="middle">More than half = 126</text><rect x="15" y="80" width="310" height="55" rx="7"/><text x="170" y="103" text-anchor="middle">Present and voting: 180</text><text x="170" y="124" text-anchor="middle">Two-thirds = 120</text><rect x="15" y="150" width="310" height="55" rx="7"/><text x="170" y="173" text-anchor="middle">Required yes votes</text><text x="170" y="194" text-anchor="middle">Higher threshold: 126</text><rect x="15" y="220" width="310" height="55" rx="7"/><text x="170" y="243" text-anchor="middle">Both conditions apply</text><text x="170" y="264" text-anchor="middle">Compute separately in each House</text></svg>