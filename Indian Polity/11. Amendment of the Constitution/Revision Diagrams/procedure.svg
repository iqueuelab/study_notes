<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-label="Both parliamentary Houses and applicable ratification requirements must be satisfied."><style>text{font:16px Arial,sans-serif;fill:#172536}rect{fill:#eef5f3;stroke:#12625d}.axis{stroke:#172536;stroke-width:2;fill:none}</style><rect x="15" y="10" width="310" height="55" rx="7"/><text x="170" y="33" text-anchor="middle">Bill in either House</text><text x="170" y="54" text-anchor="middle">Minister or private member</text><path class="axis" d="M170 65 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="90" width="310" height="55" rx="7"/><text x="170" y="113" text-anchor="middle">Each House separately</text><text x="170" y="134" text-anchor="middle">Total majority + two-thirds votes</text><path class="axis" d="M170 145 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="170" width="310" height="55" rx="7"/><text x="170" y="193" text-anchor="middle">Federal proviso triggered?</text><text x="170" y="214" text-anchor="middle">At least half the States ratify</text><path class="axis" d="M170 225 v19 l-5 -6 m5 6 l5 -6"/><rect x="15" y="250" width="310" height="55" rx="7"/><text x="170" y="273" text-anchor="middle">President must assent</text><text x="170" y="294" text-anchor="middle">Commencement follows Act’s terms</text></svg>